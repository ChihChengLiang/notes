<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
  <link rel="stylesheet" href="{{root}}reveal-base.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
  <link rel="stylesheet" href="{{root}}reveal-theme.css">
  <script>if (window.location.search.includes('print-pdf')) document.write('<link rel="stylesheet" href="{{root}}reveal-print.css">');</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="hand-drawn" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.025" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="reveal">
  <div class="slides">
    {{slides}}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/notes/notes.js"></script>
<script>
// Set full-viewport backgrounds before Reveal.initialize() so reveal.js picks them up.
// data-background-* fills the entire browser window, unlike CSS background-color on sections.
(function() {
  var root = '{{root}}';
  document.querySelectorAll('.slides section.title-slide').forEach(function(el) {
    el.setAttribute('data-background-color', 'oklch(23.2% 0.043 78)');
    el.setAttribute('data-background-image', root + 'assets/bedge-grunge.png');
    el.setAttribute('data-background-size', 'cover');
    el.setAttribute('data-background-opacity', '0.3');
  });
  document.querySelectorAll('.slides section.chapter').forEach(function(el) {
    el.setAttribute('data-background-color', 'oklch(92.5% 0.040 78)');
    el.setAttribute('data-background-size', 'cover');
  });
  document.querySelectorAll('.slides section:not(.title-slide):not(.chapter)').forEach(function(el) {
    el.setAttribute('data-background-color', 'oklch(99.1% 0.011 78)');
    el.setAttribute('data-background-size', 'cover');
  });
})();
</script>
<script type="module">
import { initMermaid, mermaid } from '{{root}}mermaid-init.js';

initMermaid({ startOnLoad: false });

// reveal.css hides every slide but .present by default. Flowchart diagrams
// measure themselves via SVG getBBox(), which Firefox reports as 0 for
// elements under a display:none ancestor, so force all slides visible
// while Mermaid renders, then hand control back to Reveal's own CSS.
const slideSections = document.querySelectorAll('.slides > section, .slides > section > section');
slideSections.forEach((el) => { el.style.display = 'block'; });

// A `%% fragment` comment anywhere in a mermaid block opts it into per-node
// click-to-reveal: the first node shows immediately, then each following
// node (plus the edge leading into it) becomes a Reveal fragment, so they
// fade in one step at a time along with the rest of the slide's fragments.
const fragmentDiagrams = Array.from(document.querySelectorAll('pre.mermaid'))
  .filter((el) => /%%\s*fragment\b/.test(el.textContent));
fragmentDiagrams.forEach((el) => {
  el.classList.add('js-fragment-reveal');
  // Stash declaration-order node names from the SOURCE text before mermaid
  // replaces this element's content — once subgraphs are involved, mermaid
  // groups the rendered `.node` DOM by cluster rather than declaration
  // order, so DOM order can't be trusted as the reveal sequence.
  const order = [];
  const re = /^\s*(\w+)\s*(?:\(\(|\[|\()/gm;
  let match;
  while ((match = re.exec(el.textContent))) {
    if (!order.includes(match[1])) order.push(match[1]);
  }
  el.dataset.fragmentOrder = order.join(',');
});

// suppressErrors: a bad diagram renders an inline error instead of throwing —
// otherwise one broken diagram would reject this await and Reveal.initialize()
// below would never run, breaking navigation for the entire deck.
await mermaid.run({ querySelector: 'pre.mermaid', suppressErrors: true });
slideSections.forEach((el) => { el.style.display = ''; });

document.querySelectorAll('pre.mermaid.js-fragment-reveal').forEach((el) => {
  const svg = el.querySelector('svg');
  if (!svg) return;
  const nodes = Array.from(svg.querySelectorAll('.node'));
  if (nodes.length > 0) {
    // Flowcharts: every node is its own fragment, in SOURCE declaration
    // order (see above — not DOM order, which subgraphs scramble). Edges
    // are assigned by NAME (via mermaid's `data-id="L_<source>_<target>_<n>"`)
    // to the LARGER of their two endpoints' reveal indices — not by array
    // position — so a node with more than one incoming/outgoing edge still
    // works.
    const nameOf = (id) => (id.match(/-flowchart-(.+)-\d+$/) || [, id])[1];
    const byName = new Map(nodes.map((n) => [nameOf(n.id), n]));
    const declared = (el.dataset.fragmentOrder || '').split(',').filter((n) => byName.has(n));
    byName.forEach((_, name) => { if (!declared.includes(name)) declared.push(name); });

    const indexByName = new Map();
    declared.forEach((name, i) => {
      const node = byName.get(name);
      node.classList.add('fragment');
      node.setAttribute('data-fragment-index', String(i));
      indexByName.set(name, i);
    });

    const edgePaths = Array.from(svg.querySelectorAll('.edgePaths > path'));
    const edgeIndices = edgePaths.map((path, i) => {
      // A manually-named edge (`e1@==>`, used for the `animate: true` arrows
      // elsewhere in this deck) loses its source/target in data-id — it's
      // just the literal name "e1". Fall back to the edge's own position
      // among edges in that case, matching this function's pre-rename behavior.
      const m = (path.getAttribute('data-id') || '').match(/^L_(.+?)_(.+?)_\d+$/);
      if (!m) return i;
      return Math.max(indexByName.get(m[1]) ?? -1, indexByName.get(m[2]) ?? -1, 0);
    });
    edgePaths.forEach((path, i) => {
      path.classList.add('fragment');
      path.setAttribute('data-fragment-index', String(edgeIndices[i]));
    });

    // Edge labels don't carry `data-id`, but mermaid emits them in the same
    // order as their edges (as duplicate pairs — a visible copy plus a
    // background copy), so distribute them proportionally across edges.
    const edgeLabels = Array.from(svg.querySelectorAll('.edgeLabels > .edgeLabel'));
    const labelsPerEdge = edgePaths.length > 0 ? (edgeLabels.length / edgePaths.length) || 1 : 1;
    edgeLabels.forEach((label, i) => {
      const edgeIndex = Math.min(Math.floor(i / labelsPerEdge), edgeIndices.length - 1);
      label.classList.add('fragment');
      label.setAttribute('data-fragment-index', String(edgeIndices[edgeIndex] ?? 0));
    });
    return;
  }

  // Sequence diagrams: participant boxes/lifelines stay always visible;
  // each message becomes one fragment. Mermaid emits every message as a
  // `.messageText` immediately followed by its `.messageLine0`/`.messageLine1`
  // sibling (no shared wrapper element), in source order, so pairing up
  // consecutive matches here reconstructs one fragment step per message.
  const messageEls = Array.from(svg.querySelectorAll('.messageText, .messageLine0, .messageLine1'));
  for (let i = 0; i < messageEls.length; i += 2) {
    const index = i / 2;
    [messageEls[i], messageEls[i + 1]].forEach((elm) => {
      if (!elm) return;
      elm.classList.add('fragment');
      elm.setAttribute('data-fragment-index', String(index));
    });
  }
});

Reveal.initialize({
  hash: true,
  slideNumber: 'c/t',
  transition: 'fade',
  backgroundTransition: 'fade',
  plugins: [ RevealNotes ],
});
</script>
</body>
</html>
