<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
  <link rel="stylesheet" href="{{root}}reveal-base.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
  <link rel="stylesheet" href="{{root}}reveal-theme.css">
  <script>if (window.location.search.includes('print-pdf')) document.write('<link rel="stylesheet" href="{{root}}reveal-print.css">');</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="hand-drawn" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.025" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="reveal">
  <div class="slides">
    {{slides}}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/notes/notes.js"></script>
<script>
// Set full-viewport backgrounds before Reveal.initialize() so reveal.js picks them up.
// data-background-* fills the entire browser window, unlike CSS background-color on sections.
(function() {
  var root = '{{root}}';
  document.querySelectorAll('.slides section.title-slide').forEach(function(el) {
    el.setAttribute('data-background-color', 'oklch(23.2% 0.043 78)');
    el.setAttribute('data-background-image', root + 'assets/bedge-grunge.png');
    el.setAttribute('data-background-size', 'cover');
    el.setAttribute('data-background-opacity', '0.3');
  });
  document.querySelectorAll('.slides section.chapter').forEach(function(el) {
    el.setAttribute('data-background-color', 'oklch(92.5% 0.040 78)');
    el.setAttribute('data-background-size', 'cover');
  });
  document.querySelectorAll('.slides section:not(.title-slide):not(.chapter)').forEach(function(el) {
    el.setAttribute('data-background-color', 'oklch(99.1% 0.011 78)');
    el.setAttribute('data-background-size', 'cover');
  });
})();
</script>
<script type="module">
// A `%% fragment` comment anywhere in a mermaid block opts it into per-node
// click-to-reveal: the first node shows immediately, then each following
// node (plus the edges leading into it) becomes a Reveal fragment, so they
// fade in one step at a time along with the rest of the slide's fragments.
// Diagrams are pre-rendered by Pele at build time (src/diagram.ts), which also
// stashes the source declaration order in `data-fragment-order`.
document.querySelectorAll('.diagram.js-fragment-reveal').forEach((el) => {
  const svg = el.querySelector('svg');
  if (!svg) return;
  const reveal = (elm, index) => {
    elm.classList.add('fragment');
    elm.setAttribute('data-fragment-index', String(index));
  };

  if (svg.classList.contains('pele-flowchart')) {
    // Every node is its own fragment, in SOURCE declaration order.
    const byName = new Map(Array.from(svg.querySelectorAll('.pele-node[data-id]'), (n) => [n.dataset.id, n]));
    const declared = (el.dataset.fragmentOrder || '').split(',').filter((n) => byName.has(n));
    byName.forEach((_, name) => { if (!declared.includes(name)) declared.push(name); });
    const indexByName = new Map(declared.map((name, i) => [name, i]));
    declared.forEach((name, i) => reveal(byName.get(name), i));

    // An edge `L_<source>_<target>_<n>` appears with the LATER of its two
    // endpoints. A manually-named edge (`e1@==>`) loses its endpoints in
    // data-id, so fall back to its position among edges. Edge labels share
    // their edge's data-id.
    const edgeIndex = new Map();
    svg.querySelectorAll('.pele-edge[data-id]').forEach((edge, i) => {
      const m = edge.dataset.id.match(/^L_(.+?)_(.+?)_\d+$/);
      const index = m ? Math.max(indexByName.get(m[1]) ?? -1, indexByName.get(m[2]) ?? -1, 0) : i;
      edgeIndex.set(edge.dataset.id, index);
      reveal(edge, index);
    });
    svg.querySelectorAll('.pele-edge-label[data-id]').forEach((label) => {
      reveal(label, edgeIndex.get(label.dataset.id) ?? 0);
    });
    return;
  }

  if (svg.classList.contains('pele-sequence')) {
    // Participants stay visible; each message (arrow + its label, which share
    // a data-id `i<n>` in source order) becomes one fragment step.
    const ids = [];
    svg.querySelectorAll('.pele-message[data-id]').forEach((msg) => {
      if (!ids.includes(msg.dataset.id)) ids.push(msg.dataset.id);
    });
    ids.forEach((id, index) => {
      svg.querySelectorAll(`.pele-message[data-id="${id}"], .pele-edge-label[data-id="${id}"]`)
        .forEach((elm) => reveal(elm, index));
    });
  }
});

Reveal.initialize({
  hash: true,
  slideNumber: 'c/t',
  transition: 'fade',
  backgroundTransition: 'fade',
  plugins: [ RevealNotes ],
});
</script>
</body>
</html>
