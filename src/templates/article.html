<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page_title}}</title>
  <meta property="og:title" content="{{og_title}}">
  <meta property="og:description" content="{{og_description}}">
  <meta name="description" content="{{og_description}}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
  <script>document.documentElement.className = localStorage.getItem('cc-theme') || 'light';</script>
  <script src="/client.js"></script>
  <script type="module">
import { initMermaid } from '/mermaid-init.js';
initMermaid({ startOnLoad: true });
  </script>
</head>
<body>
<!-- SVG filter for hand-drawn table border jitter — filter targets ::before pseudo only, text is unaffected -->
<svg width="0" height="0" style="position:absolute;overflow:hidden">
  <defs>
    <filter id="hand-drawn" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.025" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="theme-bar">
  <a class="gh-link" href="https://github.com/chihChengLiang/notes" target="_blank" rel="noopener" aria-label="View markdown source on GitHub">
    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </a>
  <div class="theme-seg" role="group" aria-label="Theme">
    <button class="theme-btn" data-theme="light">light</button>
    <button class="theme-btn" data-theme="dark">dark</button>
  </div>
</div>
  {{content}}
<script>
(function() {
  var current = document.documentElement.className || 'light';
  var btns = document.querySelectorAll('.theme-btn');
  function setTheme(t) {
    document.documentElement.className = t;
    localStorage.setItem('cc-theme', t);
    btns.forEach(function(b) { b.setAttribute('aria-pressed', String(b.dataset.theme === t)); });
  }
  btns.forEach(function(b) {
    b.setAttribute('aria-pressed', String(b.dataset.theme === current));
    b.addEventListener('click', function() { setTheme(b.dataset.theme); });
  });
})();
</script>
</body>
</html>
