    <svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 320" role="img">
      <title>Transparent transaction graph</title>
      <desc>Alice sends ETH to Bob and Carol. Bob sends ETH to Dave. Every link is visible — sender, receiver, and value are public on the blockchain.</desc>
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Alice -->
      <g>
        <circle cx="100" cy="160" r="34" fill="none" stroke="oklch(62.2% 0.054 78)" stroke-width="0.5"/>
        <text x="100" y="152" text-anchor="middle" dominant-baseline="central" style="font-size:22px">🐱</text>
        <text x="100" y="174" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:oklch(23.2% 0.043 78);font-weight:500">Alice</text>
        <text x="100" y="188" text-anchor="middle" dominant-baseline="central" style="font-size:10px;fill:oklch(57.7% 0.054 78)">0xA1c3…</text>
      </g>

      <!-- Bob -->
      <g>
        <circle cx="320" cy="90" r="34" fill="none" stroke="oklch(62.2% 0.054 78)" stroke-width="0.5"/>
        <text x="320" y="82" text-anchor="middle" dominant-baseline="central" style="font-size:22px">🐶</text>
        <text x="320" y="104" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:oklch(23.2% 0.043 78);font-weight:500">Bob</text>
        <text x="320" y="118" text-anchor="middle" dominant-baseline="central" style="font-size:10px;fill:oklch(57.7% 0.054 78)">0xB0b7…</text>
      </g>

      <!-- Carol -->
      <g>
        <circle cx="320" cy="235" r="34" fill="none" stroke="oklch(62.2% 0.054 78)" stroke-width="0.5"/>
        <text x="320" y="227" text-anchor="middle" dominant-baseline="central" style="font-size:22px">🐰</text>
        <text x="320" y="249" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:oklch(23.2% 0.043 78);font-weight:500">Carol</text>
        <text x="320" y="263" text-anchor="middle" dominant-baseline="central" style="font-size:10px;fill:oklch(57.7% 0.054 78)">0xC4r0…</text>
      </g>

      <!-- Dave -->
      <g>
        <circle cx="550" cy="90" r="34" fill="none" stroke="oklch(62.2% 0.054 78)" stroke-width="0.5"/>
        <text x="550" y="82" text-anchor="middle" dominant-baseline="central" style="font-size:22px">🦊</text>
        <text x="550" y="104" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:oklch(23.2% 0.043 78);font-weight:500">Dave</text>
        <text x="550" y="118" text-anchor="middle" dominant-baseline="central" style="font-size:10px;fill:oklch(57.7% 0.054 78)">0xD4v3…</text>
      </g>

      <!-- Arrow Alice -> Bob -->
      <line x1="133" y1="143" x2="283" y2="102" stroke="oklch(48% 0.13 28)" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
      <rect x="178" y="107" width="62" height="20" rx="4" fill="oklch(48% 0.13 28 / 0.12)"/>
      <text x="209" y="117" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(48% 0.13 28);font-weight:500">1.0 ETH</text>

      <!-- Arrow Alice -> Carol -->
      <line x1="133" y1="178" x2="283" y2="221" stroke="oklch(48% 0.13 28)" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
      <rect x="173" y="187" width="62" height="20" rx="4" fill="oklch(48% 0.13 28 / 0.12)"/>
      <text x="204" y="197" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(48% 0.13 28);font-weight:500">0.5 ETH</text>

      <!-- Arrow Bob -> Dave -->
      <line x1="354" y1="90" x2="513" y2="90" stroke="oklch(48% 0.13 28)" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
      <rect x="402" y="78" width="62" height="20" rx="4" fill="oklch(48% 0.13 28 / 0.12)"/>
      <text x="433" y="88" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(48% 0.13 28);font-weight:500">0.9 ETH</text>

      <!-- Observer eye -->
      <text x="550" y="220" text-anchor="middle" style="font-size:20px">👁️</text>
      <text x="550" y="248" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(57.7% 0.054 78)">Anyone can</text>
      <text x="550" y="262" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(57.7% 0.054 78)">see this graph</text>
    </svg>
