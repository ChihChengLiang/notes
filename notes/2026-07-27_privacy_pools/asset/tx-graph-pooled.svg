    <svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 360" role="img">
      <title>Transaction graph after using a mixing pool</title>
      <desc>Alice, Bob, and Carol all deposit into a shared pool contract. Three withdrawals go to new addresses. The link between depositor and withdrawer is broken — an observer cannot tell who withdrew what.</desc>
      <defs>
        <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Depositors -->
      <g>
        <circle cx="90" cy="100" r="30" fill="none" stroke="oklch(62.2% 0.054 78)" stroke-width="0.5"/>
        <text x="90" y="93" text-anchor="middle" dominant-baseline="central" style="font-size:18px">🐱</text>
        <text x="90" y="112" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(23.2% 0.043 78);font-weight:500">Alice</text>
      </g>
      <g>
        <circle cx="90" cy="185" r="30" fill="none" stroke="oklch(62.2% 0.054 78)" stroke-width="0.5"/>
        <text x="90" y="178" text-anchor="middle" dominant-baseline="central" style="font-size:18px">🐶</text>
        <text x="90" y="197" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(23.2% 0.043 78);font-weight:500">Bob</text>
      </g>
      <g>
        <circle cx="90" cy="270" r="30" fill="none" stroke="oklch(62.2% 0.054 78)" stroke-width="0.5"/>
        <text x="90" y="263" text-anchor="middle" dominant-baseline="central" style="font-size:18px">🐰</text>
        <text x="90" y="282" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(23.2% 0.043 78);font-weight:500">Carol</text>
      </g>

      <!-- Pool contract -->
      <rect x="258" y="130" width="144" height="100" rx="12" fill="none" stroke="oklch(62.2% 0.054 78)" stroke-width="0.5"/>
      <rect x="258" y="130" width="144" height="100" rx="12" fill="oklch(98.1% 0.018 78)"/>
      <text x="330" y="165" text-anchor="middle" dominant-baseline="central" style="font-size:20px">🏦</text>
      <text x="330" y="190" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:oklch(23.2% 0.043 78);font-weight:500">Pool contract</text>
      <text x="330" y="208" text-anchor="middle" dominant-baseline="central" style="font-size:10px;fill:oklch(57.7% 0.054 78)">0xabcd…</text>

      <!-- Withdrawers (new addresses) -->
      <g>
        <circle cx="560" cy="100" r="30" fill="none" stroke="oklch(62.2% 0.054 78)" stroke-width="0.5" stroke-dasharray="4 3"/>
        <text x="560" y="93" text-anchor="middle" dominant-baseline="central" style="font-size:18px">🐹</text>
        <text x="560" y="112" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(57.7% 0.054 78)">New addr 1</text>
      </g>
      <g>
        <circle cx="560" cy="185" r="30" fill="none" stroke="oklch(62.2% 0.054 78)" stroke-width="0.5" stroke-dasharray="4 3"/>
        <text x="560" y="178" text-anchor="middle" dominant-baseline="central" style="font-size:18px">🐨</text>
        <text x="560" y="197" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(57.7% 0.054 78)">New addr 2</text>
      </g>
      <g>
        <circle cx="560" cy="270" r="30" fill="none" stroke="oklch(62.2% 0.054 78)" stroke-width="0.5" stroke-dasharray="4 3"/>
        <text x="560" y="263" text-anchor="middle" dominant-baseline="central" style="font-size:18px">🐼</text>
        <text x="560" y="282" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(57.7% 0.054 78)">New addr 3</text>
      </g>

      <!-- Deposit arrows (solid) -->
      <line x1="120" y1="100" x2="256" y2="160" stroke="oklch(48% 0.13 28)" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>
      <line x1="120" y1="185" x2="256" y2="185" stroke="oklch(48% 0.13 28)" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>
      <line x1="120" y1="270" x2="256" y2="210" stroke="oklch(48% 0.13 28)" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>

      <!-- Deposit label -->
      <text x="168" y="130" text-anchor="middle" style="font-size:10px;fill:oklch(48% 0.13 28)">deposit</text>

      <!-- Withdrawal arrows (dashed) -->
      <line x1="403" y1="160" x2="527" y2="100" stroke="oklch(57.7% 0.054 78)" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arr2)"/>
      <line x1="403" y1="185" x2="527" y2="185" stroke="oklch(57.7% 0.054 78)" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arr2)"/>
      <line x1="403" y1="210" x2="527" y2="270" stroke="oklch(57.7% 0.054 78)" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arr2)"/>

      <!-- Withdrawal label -->
      <text x="476" y="130" text-anchor="middle" style="font-size:10px;fill:oklch(57.7% 0.054 78)">withdraw</text>

      <!-- Question marks over the withdrawal arrows -->
      <rect x="432" y="145" width="22" height="22" rx="4" fill="oklch(99.1% 0.011 78)"/>
      <text x="443" y="156" text-anchor="middle" dominant-baseline="central" style="font-size:14px;fill:oklch(77.5% 0.053 78)">?</text>
      <rect x="432" y="175" width="22" height="22" rx="4" fill="oklch(99.1% 0.011 78)"/>
      <text x="443" y="186" text-anchor="middle" dominant-baseline="central" style="font-size:14px;fill:oklch(77.5% 0.053 78)">?</text>
      <rect x="432" y="215" width="22" height="22" rx="4" fill="oklch(99.1% 0.011 78)"/>
      <text x="443" y="226" text-anchor="middle" dominant-baseline="central" style="font-size:14px;fill:oklch(77.5% 0.053 78)">?</text>

      <!-- Observer -->
      <text x="330" y="318" text-anchor="middle" style="font-size:16px">👁️</text>
      <text x="330" y="340" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:oklch(57.7% 0.054 78)">Observer can see deposits and withdrawals — but not who withdrew what</text>
    </svg>
